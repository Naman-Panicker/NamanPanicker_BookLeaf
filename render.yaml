# Render Blueprint for the Express API (ADR-0001). Ohio matches the Neon region (us-east-2).
services:
  - type: web
    name: bookleaf-api
    runtime: node
    region: ohio
    plan: free
    # NODE_ENV=production would make pnpm skip devDependencies, and the build needs tsup.
    # `corepack pnpm` runs the version pinned in package.json, not the one Render preinstalls.
    buildCommand: NODE_ENV=development corepack pnpm install --frozen-lockfile && corepack pnpm --filter @bookleaf/api build && corepack pnpm --filter @bookleaf/api db:migrate
    # tsup bundles the workspace code, so running the server needs node and not pnpm.
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
