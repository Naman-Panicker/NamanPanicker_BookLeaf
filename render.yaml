# Render Blueprint for the Express API (ADR-0001). Ohio matches the Neon region (us-east-2).
services:
  - type: web
    name: bookleaf-api
    runtime: node
    region: ohio
    plan: free
    # NODE_ENV=production would make pnpm skip devDependencies, and the build needs tsup.
    buildCommand: corepack enable && NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @bookleaf/api build && pnpm --filter @bookleaf/api db:migrate
    startCommand: pnpm --filter @bookleaf/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
